# ============================================================================
# MAHALAKSHMI HOSPITAL MANAGEMENT SYSTEM — PRODUCTION DOCKER COMPOSE
# Requires a configured .env file (copy from .env.example).
# No hardcoded passwords or JWT secrets. PostgreSQL is strictly isolated
# inside the internal Docker network (no host port exposure).
# ============================================================================

services:
  postgres:
    image: postgres:18-alpine
    container_name: mahalakshmi-hms-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - db_backups:/backups
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - hms_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mahalakshmi-hms-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      REPORTS_STORAGE_DIR: /app/secure-storage/reports
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
    volumes:
      - report_vault:/app/secure-storage/reports
    networks:
      - hms_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mahalakshmi-hms-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
     networks:
      - hms_internal
      - hms_public
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  hms_internal:
    driver: bridge
    internal: true
  hms_public:
    driver: bridge

volumes:
  pgdata:
    name: mahalakshmi_hms_pgdata
  report_vault:
    name: mahalakshmi_hms_report_vault
  db_backups:
    name: mahalakshmi_hms_db_backups
