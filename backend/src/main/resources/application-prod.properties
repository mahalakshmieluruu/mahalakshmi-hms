# ============================================================================
# PRODUCTION ENVIRONMENT CONFIGURATION (application-prod.properties)
# No hardcoded secrets or fallback databases allowed in production.
# All sensitive values MUST be injected from protected environment variables.
# ============================================================================
app.environment=${APP_ENVIRONMENT:production}
app.db.postgres.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:mahalakshmi_hms}}
app.db.postgres.username=${DB_USERNAME:${POSTGRES_USER}}
app.db.postgres.password=${DB_PASSWORD}
app.db.fallback.url=
app.db.allow-fallback=false

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

app.storage.reports-dir=${REPORTS_STORAGE_DIR:/app/secure-storage/reports}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

server.forward-headers-strategy=native
server.error.include-stacktrace=never
server.error.include-message=always
