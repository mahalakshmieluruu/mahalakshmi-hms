# ============================================================================
# MAHALAKSHMI HOSPITAL HMS — HARDENED HTTPS NGINX REVERSE PROXY
# Redirects all HTTP (port 80) traffic to HTTPS (port 443).
# Proxies /api/ to the internal Spring Boot backend with security headers.
# Blocks any direct public access to medical storage paths.
# ============================================================================

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/hms.crt;
    ssl_certificate_key /etc/nginx/ssl/hms.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    # Strict Production Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Block any direct public URL attempt to access raw storage directories
    location ~* ^/(secure-storage|reports|backups)/ {
        deny all;
        return 403;
    }

    # Secure Reverse Proxy to Internal Spring Boot Backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 90s;

        # Prevent browser caching of confidential clinical API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
    }

    # PWA Service Worker & Manifest (must not be stale-cached)
    location ~* ^/(sw\.js|manifest\.json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # React SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
